  :root{

    --line:#D9CFB8; --line2:#EDE6D3; --brass:#B08D57; --muted:#8A7E63;
    --muted2:#8A93A6; --good:#2F6B4F; --bad:#A8432E;

  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

  .divider-row{border-top:1px solid var(--line);}
  .divider-row > div:first-child{border-left:1px solid var(--line);}
  .stat-label{font-size:11px;color:var(--muted);font-weight:500;display:block;margin-bottom:4px;}
  .stat-value{font-size:17px;font-weight:700;}
  .good{color:var(--good);} .bad{color:var(--bad);}
  .mini{background:#F0EADA;border-radius:8px;padding:8px 4px;text-align:center;}

  label.field{display:flex;flex-direction:column;gap:4px;font-size:13px;margin-bottom:10px;}

  .btn-primary{background:var(--ink);color:var(--paper);}
  .btn-primary:hover{background:var(--ink2);}
  .btn-primary:disabled{opacity:.5;cursor:default;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-ghost:hover{background:#F0EADA;}
  .btn-danger{background:var(--bad);color:#fff;}
  .row{display:flex;gap:8px;}
  .row.wrap{flex-wrap:wrap;}
  .flex1{flex:1;}
  .item-card{border:1px solid var(--line);border-radius:8px;padding:10px;background:rgba(255,255,255,.6);margin-bottom:10px;}
  .item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .muted{color:var(--muted);font-size:12px;}
  .x-btn{color:var(--bad);background:none;border:none;cursor:pointer;font-size:16px;line-height:1;}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--ink);border-top:1px solid #3A4356;z-index:40;display:flex;overflow-x:auto;}
  nav.tabs .wrap{display:flex;min-width:max-content;margin:0 auto;max-width:600px;width:100%;}
  nav.tabs button{flex:1;min-width:60px;background:none;border:none;color:var(--muted2);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;font-size:10px;font-family:inherit;cursor:pointer;}

  .step-label{font-size:12px;color:var(--muted);margin-bottom:4px;}
  select.status-select{font-size:11px;background:#F0EADA;border:1px solid var(--line);border-radius:5px;padding:4px 6px;}
  .warn{color:var(--bad);font-size:13px;display:flex;align-items:center;gap:5px;margin-top:8px;}

<script>
/* ============================ DATA LAYER ============================ */
const STORE_KEY = 'daftary-data';
const uid = () => Math.random().toString(36).slice(2,10);
const todayISO = () => new Date().toISOString().slice(0,10);
const num = v => (v===''||v===null||v===undefined||isNaN(v)) ? 0 : Number(v);
const fmt = (n,cur='USD') => (n===null||n===undefined||isNaN(n)) ? '—' : Number(n).toLocaleString('en-US',{maximumFractionDigits:2}) + ' ' + cur;
const clone = o => JSON.parse(JSON.stringify(o));

const EXPENSE_CATS = [
  {key:'materials',label:'مواد'},{key:'labor',label:'أجور عمال'},{key:'technicians',label:'أجور فنيين'},
  {key:'transport',label:'نقل'},{key:'fuel',label:'وقود'},{key:'tools',label:'أدوات ومعدات'},
  {key:'maintenance',label:'صيانة'},{key:'rent',label:'إيجار'},{key:'utilities',label:'كهرباء واتصالات'},
  {key:'marketing',label:'تسويق'},{key:'admin',label:'مصاريف إدارية'},{key:'personal',label:'مصاريف شخصية'},
  {key:'other',label:'أخرى'},
];
const TX_TYPES = [
  {key:'receipt',label:'قبض من عميل'},{key:'project_expense',label:'مصروف مشروع'},
  {key:'operating_expense',label:'مصروف تشغيلي عام'},{key:'asset_purchase',label:'شراء أصل / معدات'},
  {key:'debt_owed_to_me',label:'دين مستحق لي (أعطيت شخصًا)'},{key:'debt_owed_by_me',label:'دين مستحق عليّ'},
  {key:'debt_repayment_in',label:'تحصيل دين مستحق لي'},{key:'debt_repayment_out',label:'تسديد دين مستحق عليّ'},
  {key:'capital_in',label:'إضافة رأس مال'},{key:'withdrawal',label:'سحب شخصي'},{key:'transfer',label:'تحويل بين حسابات'},
];
const typeLabel = k => (TX_TYPES.find(t=>t.key===k)||{}).label || k;
const catLabel = k => (EXPENSE_CATS.find(c=>c.key===k)||{}).label || k;

function emptyData(){
  return {
    setupDone:false, meta:{currency:'USD'},
    cash:{cash:0,bank:0,wallets:0}, capital:{initial:0,additions:0,withdrawals:0},
    clients:[], projects:[], debts:[], transactions:[], nextSeq:1,
  };
}
function loadData(){
  try{ const raw = localStorage.getItem(STORE_KEY); return raw?JSON.parse(raw):emptyData(); }
  catch(e){ return emptyData(); }
}
function saveData(d){ localStorage.setItem(STORE_KEY, JSON.stringify(d)); }

let DATA = loadData();
let TAB = 'dashboard';
let DRAFT = null; // pending transaction confirmation
let CONFIRM_RESET = false;
let SETUP_STEP = 0;
let SETUP_DRAFT = null;

function persist(next){ DATA = next; saveData(DATA); render(); }
function showToast(msg, tone){
  const el = document.createElement('div');
  el.className = 'toast' + (tone==='bad'?' bad':'');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3500);
}

/* ============================ HEURISTIC PARSER ============================
   يعمل بدون إنترنت وبدون أي API خارجي — يعتمد على كلمات مفتاحية وأرقام.
   أقل دقة من نموذج ذكاء اصطناعي، لكنه يعطي مسودة قابلة للتعديل قبل الحفظ. */
function heuristicParse(text, clients, projects){
  const res = {date: todayISO(), type:'operating_expense', clientName:'', projectName:'',
    income:'', expenses:[], debtParty:'', debtAmount:'', method:'cash', currency: DATA.meta.currency, notes:text};

  // income
  const incomeMatch = text.match(/(?:قبضت|استلمت|قبض)\D{0,15}([\d,.]+)/);
  if(incomeMatch) res.income = num(incomeMatch[1].replace(/,/g,''));

  // expense categories
  const catPatterns = [
    ['materials', /مواد\D{0,10}([\d,.]+)|([\d,.]+)\D{0,10}مواد/],
    ['labor', /أجور\s*عمال\D{0,10}([\d,.]+)|([\d,.]+)\D{0,10}أجور\s*عمال/],
    ['technicians', /أجور\s*فني(?:ين)?\D{0,10}([\d,.]+)|([\d,.]+)\D{0,10}أجور\s*فني/],
    ['transport', /نقل\D{0,10}([\d,.]+)|([\d,.]+)\D{0,10}نقل/],
    ['fuel', /وقود\D{0,10}([\d,.]+)|([\d,.]+)\D{0,10}وقود/],
    ['tools', /أدوات\D{0,10}([\d,.]+)|معدات\D{0,10}([\d,.]+)/],
    ['rent', /إيجار\D{0,10}([\d,.]+)/],
    ['personal', /مصروف\s*شخصي\D{0,10}([\d,.]+)/],
  ];
  catPatterns.forEach(([cat, re])=>{
    const m = text.match(re);
    if(m){ const amt = m.slice(1).find(g=>g); if(amt) res.expenses.push({category:cat, amount:num(amt.replace(/,/g,''))}); }
  });
  // generic "دفعت" without category -> other
  if(res.expenses.length===0){
    const paidMatch = text.match(/(?:دفعت|صرفت)\D{0,15}([\d,.]+)/);
    if(paidMatch) res.expenses.push({category:'other', amount:num(paidMatch[1].replace(/,/g,''))});
  }

  // client: known name mentioned in text
  const foundClient = clients.find(c => c.name && text.includes(c.name));
  if(foundClient) res.clientName = foundClient.name;
  else{
    const m = text.match(/من\s+([\u0600-\u06FF]+)/);
    if(m) res.clientName = m[1];
  }
  // project: known name mentioned, else after "مشروع"
  const foundProject = projects.find(p => p.name && text.includes(p.name));
  if(foundProject) res.projectName = foundProject.name;
  else{
    const m = text.match(/مشروع\s+([\u0600-\u06FF\s]{2,20}?)(?:[,.،]|$)/);
    if(m) res.projectName = 'مشروع ' + m[1].trim();
  }

  if(res.income && res.expenses.length===0) res.type='receipt';
  else if(res.expenses.length>0 && res.projectName) res.type='project_expense';
  else if(res.expenses.length>0) res.type='operating_expense';

  const currencyMatch = text.match(/(USD|EUR|SYP|دولار|يورو)/);
  if(currencyMatch){
    const c = currencyMatch[1];
    res.currency = c==='دولار' ? 'USD' : c==='يورو' ? 'EUR' : c;
  }
  return res;
}

/* ============================ AGGREGATES ============================ */
function computeAggregates(data){
  const cur = data.meta.currency;
  const cashBalance = num(data.cash.cash) + num(data.cash.bank) + num(data.cash.wallets);
  const projects = data.projects.map(p=>{
    const totalCost = Object.values(p.costs||{}).reduce((a,b)=>a+num(b),0);
    const profit = num(p.contractValue) - totalCost;
    const remaining = num(p.contractValue) - num(p.received);
    return {...p, totalCost, profit, remaining};
  });
  const activeProjects = projects.filter(p=>p.status!=='مكتمل'&&p.status!=='ملغى');
  const completedProjects = projects.filter(p=>p.status==='مكتمل');
  const stoppedProjects = projects.filter(p=>p.status==='متوقف');
  const totalReceivablesFromClients = projects.reduce((a,p)=>a+Math.max(p.remaining,0),0);
  const debtsOwedToMe = data.debts.filter(d=>d.direction==='owed_to_me').reduce((a,d)=>a+num(d.remaining),0);
  const debtsOwedByMe = data.debts.filter(d=>d.direction==='owed_by_me').reduce((a,d)=>a+num(d.remaining),0);
  const now = new Date(); const thisMonth = now.toISOString().slice(0,7); const thisYear = now.toISOString().slice(0,4);
  const txM = data.transactions.filter(t=>t.date && t.date.slice(0,7)===thisMonth);
  const txY = data.transactions.filter(t=>t.date && t.date.slice(0,4)===thisYear);
  const monthIncome = txM.reduce((a,t)=>a+num(t.income),0), monthExpense = txM.reduce((a,t)=>a+num(t.expense),0);
  const yearIncome = txY.reduce((a,t)=>a+num(t.income),0), yearExpense = txY.reduce((a,t)=>a+num(t.expense),0);
  const totalProjectProfit = projects.reduce((a,p)=>a+p.profit,0);
  const netCapital = num(data.capital.initial)+num(data.capital.additions)-num(data.capital.withdrawals)+totalProjectProfit;
  return {cur, cashBalance, projects, activeProjects, completedProjects, stoppedProjects,
    totalReceivablesFromClients, debtsOwedToMe, debtsOwedByMe,
    monthIncome, monthExpense, monthNet: monthIncome-monthExpense,
    yearIncome, yearExpense, yearNet: yearIncome-yearExpense,
    totalProjectProfit, netCapital};
}

/* ============================ ICONS (inline svg) ============================ */
const ICONS = {
  wallet:'<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',

  credit:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',

  check:'<path d="M20 6 9 17l-5-5"/>',

  warn:'<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  landmark:'<path d="M3 22h18"/><path d="M6 18v-9"/><path d="M10 18v-9"/><path d="M14 18v-9"/><path d="M18 18v-9"/><path d="M12 2 3 7h18Z"/>',
};
function icon(name, size=16){ return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`; }

/* ============================ RENDER: TABS ============================ */
const TABS = [
  {key:'dashboard', label:'الوضع', icon:'wallet'},
  {key:'add', label:'عملية', icon:'plus'},
  {key:'projects', label:'مشاريع', icon:'building'},
  {key:'clients', label:'زبائن', icon:'users'},
  {key:'debts', label:'ديون', icon:'credit'},
  {key:'ledger', label:'السجل', icon:'file'},
  {key:'reports', label:'تقارير', icon:'trend'},
  {key:'settings', label:'إعدادات', icon:'settings'},
];
function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  if(!DATA.setupDone){ tabsEl.innerHTML=''; return; }
  tabsEl.innerHTML = `<div class="wrap">${TABS.map(t=>`
    <button class="${TAB===t.key?'active':''}" onclick="setTab('${t.key}')">${icon(t.icon,17)}<span>${t.label}</span></button>
  `).join('')}</div>`;
}
function setTab(t){ TAB=t; DRAFT=null; render(); window.scrollTo(0,0); }

/* ============================ MAIN RENDER ============================ */
function render(){
  renderTabs();
  const app = document.getElementById('app');
  if(!DATA.setupDone){ app.innerHTML = renderSetup(); return; }
  let html = '';
  if(TAB==='dashboard') html = renderDashboard();
  else if(TAB==='add') html = renderAdd();
  else if(TAB==='projects') html = renderProjects();
  else if(TAB==='clients') html = renderClients();
  else if(TAB==='debts') html = renderDebts();
  else if(TAB==='ledger') html = renderLedger();
  else if(TAB==='reports') html = renderReports();
  else if(TAB==='settings') html = renderSettings();
  app.innerHTML = html;
}

/* ============================ SETUP WIZARD ============================ */
function initSetupDraft(){ if(!SETUP_DRAFT) SETUP_DRAFT = emptyData(); }
function renderSetup(){
  initSetupDraft();
  const d = SETUP_DRAFT;
  const steps = ['رأس المال والسيولة','العملاء الحاليون (اختياري)','المشاريع الحالية (اختياري)','الديون (اختياري)'];
  let body = '';
  if(SETUP_STEP===0){
    body = `
      <label class="field"><span>رأس المال الحالي</span><input type="number" value="${d.capital.initial}" oninput="SETUP_DRAFT.capital.initial=this.value"></label>
      <label class="field"><span>رصيد الصندوق (نقد)</span><input type="number" value="${d.cash.cash}" oninput="SETUP_DRAFT.cash.cash=this.value"></label>
      <label class="field"><span>الرصيد البنكي</span><input type="number" value="${d.cash.bank}" oninput="SETUP_DRAFT.cash.bank=this.value"></label>
      <label class="field"><span>محافظ إلكترونية</span><input type="number" value="${d.cash.wallets}" oninput="SETUP_DRAFT.cash.wallets=this.value"></label>
      <label class="field"><span>العملة الأساسية</span>
        <select onchange="SETUP_DRAFT.meta.currency=this.value">
          <option value="USD" ${d.meta.currency==='USD'?'selected':''}>USD</option>
          <option value="EUR" ${d.meta.currency==='EUR'?'selected':''}>EUR</option>
          <option value="SYP" ${d.meta.currency==='SYP'?'selected':''}>SYP</option>
        </select>
      </label>`;
  } else if(SETUP_STEP===1){
    body = renderListEditor(d.clients, [{key:'name',label:'اسم الزبون'},{key:'contact',label:'تواصل'}], 'setupClient');
  } else if(SETUP_STEP===2){
    body = renderListEditor(d.projects, [{key:'name',label:'اسم المشروع'},{key:'clientName',label:'الزبون'},{key:'contractValue',label:'قيمة العقد',type:'number'},{key:'received',label:'المقبوض حتى الآن',type:'number'}], 'setupProject');
  } else if(SETUP_STEP===3){
    body = renderListEditor(d.debts, [{key:'party',label:'الطرف'},{key:'direction',label:'الاتجاه',type:'select',options:[{v:'owed_to_me',l:'مستحق لي'},{v:'owed_by_me',l:'مستحق عليّ'}]},{key:'original',label:'المبلغ الأصلي',type:'number'},{key:'paid',label:'المدفوع',type:'number'}], 'setupDebt');
  }

function finishSetup(){
  const d = SETUP_DRAFT;
  d.capital.initial = num(d.capital.initial);
  d.cash.cash = num(d.cash.cash); d.cash.bank = num(d.cash.bank); d.cash.wallets = num(d.cash.wallets);
  const clients = [...d.clients];
  const projects = d.projects.map(p=>{
    let client = clients.find(c=>c.name===p.clientName);
    if(!client && p.clientName){ client = {id:uid(), name:p.clientName, contact:'', notes:''}; clients.push(client); }
    return {...p, clientId: client?client.id:null, remaining: num(p.contractValue)-num(p.received)};
  });
  const debts = d.debts.map(deb=>({...deb, remaining: num(deb.original)-num(deb.paid)}));
  d.clients = clients; d.projects = projects; d.debts = debts; d.setupDone = true;
  SETUP_DRAFT = null; SETUP_STEP = 0;
  persist(d);

function parseText(){
  if(!ADD_TEXT.trim()) return;
  DRAFT = heuristicParse(ADD_TEXT, DATA.clients, DATA.projects);
  render();
}
function manualStart(){
  DRAFT = {date:todayISO(), type:'operating_expense', clientName:'', projectName:'', income:'', expenses:[], debtParty:'', debtAmount:'', method:'cash', currency:DATA.meta.currency, notes:''};
  render();
}
function draftExpenseAdd(){ DRAFT.expenses.push({category:'other', amount:''}); render(); }
function draftExpenseUpdate(i,k,v){ DRAFT.expenses[i][k]=v; }
function draftExpenseRemove(i){ DRAFT.expenses.splice(i,1); render(); }

function commitTransaction(){
  const d = DRAFT;
  const next = clone(DATA);
  const totalExpense = d.expenses.reduce((a,e)=>a+num(e.amount),0);
  const income = num(d.income);

  let client = null;
  if(d.clientName){
    client = next.clients.find(c=>c.name===d.clientName);
    if(!client){ client = {id:uid(), name:d.clientName, contact:'', notes:''}; next.clients.push(client); }
  }
  let project = null;
  if(d.projectName){
    project = next.projects.find(p=>p.name===d.projectName);
    if(!project){
      project = {id:uid(), name:d.projectName, clientId: client?client.id:null, clientName: d.clientName||'غير محدد',
        description:'', startDate:d.date, endDate:'', status:'قيد التنفيذ', contractValue:0, received:0,
        costs:{materials:0,labor:0,technicians:0,transport:0,fuel:0,tools:0,maintenance:0,rent:0,utilities:0,marketing:0,admin:0,personal:0,other:0}, notes:''};
      next.projects.push(project);
    }
    if(income) project.received = num(project.received) + income;
    d.expenses.forEach(e=>{ project.costs[e.category] = num(project.costs[e.category]) + num(e.amount); });
  }

  const pool = d.method==='bank' ? 'bank' : 'cash';
  if(income) next.cash[pool] = num(next.cash[pool]) + income;
  if(totalExpense) next.cash[pool] = num(next.cash[pool]) - totalExpense;

  if(d.type==='debt_owed_to_me' && d.debtAmount){
    next.debts.push({id:uid(), party:d.debtParty||'غير محدد', direction:'owed_to_me', original:num(d.debtAmount), paid:0, remaining:num(d.debtAmount), dueDate:'', reason:d.notes, status:'قائم'});
  }
  if(d.type==='debt_owed_by_me' && d.debtAmount){
    next.debts.push({id:uid(), party:d.debtParty||'غير محدد', direction:'owed_by_me', original:num(d.debtAmount), paid:0, remaining:num(d.debtAmount), dueDate:'', reason:d.notes, status:'قائم'});
  }
  if(d.type==='debt_repayment_in' || d.type==='debt_repayment_out'){
    const dir = d.type==='debt_repayment_in' ? 'owed_to_me' : 'owed_by_me';
    const deb = next.debts.find(x=>x.party===d.debtParty && x.direction===dir && num(x.remaining)>0);
    if(deb){
      const amt = num(d.debtAmount) || income || totalExpense;
      deb.paid = num(deb.paid) + amt;
      deb.remaining = Math.max(num(deb.original)-num(deb.paid),0);
      if(deb.remaining===0) deb.status='مسدد';
    }
  }
  if(d.type==='capital_in') next.capital.additions = num(next.capital.additions) + (income || num(d.debtAmount));
  if(d.type==='withdrawal') next.capital.withdrawals = num(next.capital.withdrawals) + (totalExpense || income);

  const seq = next.nextSeq;
  next.transactions.push({id:uid(), seq, date:d.date, type:d.type, description:d.notes,
    clientId: client?client.id:null, clientName: client?client.name:'',
    projectId: project?project.id:null, projectName: project?project.name:'',
    income, expense: totalExpense, method:d.method, currency:d.currency, notes:d.notes});
  next.nextSeq = seq+1;

  DATA = next; saveData(DATA);
  showToast(`تم تسجيل العملية ✅ — رصيد الصندوق: ${fmt(next.cash.cash, next.meta.currency)}`);
  DRAFT = null; ADD_TEXT='';
  render();
}

        </div>
      </div>`).join('')}
  </div></div>`;
}

/* ============================ REPORTS ============================ */
function renderReports(){
  const cur = DATA.meta.currency;
  const now = new Date(); const thisMonth = now.toISOString().slice(0,7);
  const txM = DATA.transactions.filter(t=>t.date && t.date.slice(0,7)===thisMonth);
  const income = txM.reduce((a,t)=>a+num(t.income),0), expense = txM.reduce((a,t)=>a+num(t.expense),0);
  const byCategory = {};
  DATA.projects.forEach(p=>Object.entries(p.costs||{}).forEach(([k,v])=>{ byCategory[k]=(byCategory[k]||0)+num(v); }));
  const topClients = DATA.clients.map(c=>{
    const projects = DATA.projects.filter(p=>p.clientId===c.id);
    return {name:c.name, value: projects.reduce((a,p)=>a+num(p.contractValue),0)};
  }).sort((a,b)=>b.value-a.value).slice(0,5);
  const topProjects = DATA.projects.map(p=>{
    const totalCost = Object.values(p.costs||{}).reduce((a,b)=>a+num(b),0);
    return {name:p.name, profit: num(p.contractValue)-totalCost};
  }).sort((a,b)=>b.profit-a.profit).slice(0,5);

  return `
  <div class="card"><div class="pad">
    <div class="section-title" style="padding:0 0 10px">${icon('trend')} تقرير هذا الشهر</div>
    <div class="grid3">
      <div class="mini"><div class="l">مقبوضات</div><div class="v good">${fmt(income,cur)}</div></div>
      <div class="mini"><div class="l">مصروفات</div><div class="v bad">${fmt(expense,cur)}</div></div>
      <div class="mini"><div class="l">صافي</div><div class="v ${income-expense>=0?'good':'bad'}">${fmt(income-expense,cur)}</div></div>
    </div>
  </div></div>
  <div class="card"><div class="pad">
    <div class="section-title" style="padding:0 0 10px">${icon('file')} المصاريف حسب الفئة</div>
    ${Object.entries(byCategory).filter(([,v])=>v>0).length===0?`<div class="muted" style="font-size:14px">لا توجد بيانات</div>`:
    Object.entries(byCategory).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0">
        <span>${catLabel(k)}</span><span class="mono" style="font-weight:500">${fmt(v,cur)}</span>
      </div>`).join('')}
  </div></div>
  <div class="card"><div class="pad">
    <div class="section-title" style="padding:0 0 10px">${icon('building')} أكثر المشاريع ربحية</div>
    ${topProjects.length===0?`<div class="muted" style="font-size:14px">لا توجد بيانات</div>`:
    topProjects.map(p=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0">
      <span>${p.name}</span><span class="mono good" style="font-weight:500">${fmt(p.profit,cur)}</span></div>`).join('')}
  </div></div>
  <div class="card"><div class="pad">
    <div class="section-title" style="padding:0 0 10px">${icon('users')} أكثر العملاء تعاملًا</div>
    ${topClients.length===0?`<div class="muted" style="font-size:14px">لا توجد بيانات</div>`:
    topClients.map(c=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0">
      <span>${c.name}</span><span class="mono" style="font-weight:500">${fmt(c.value,cur)}</span></div>`).join('')}
  </div></div>`;
}

/* ============================ EXCEL EXPORT ============================ */
function arDate(){ return new Date().toISOString().slice(0,10); }
function downloadWorkbook(wb, filename){
  if(typeof XLSX === 'undefined'){
    showToast('تعذّر تحميل مكتبة Excel — تحتاج اتصال إنترنت أول مرة لهذه الميزة', 'bad');
    return;
  }
  XLSX.writeFile(wb, filename);
  showToast('تم تصدير الملف ✅');
}
function sheetFromRows(rows){ return XLSX.utils.json_to_sheet(rows); }

function ledgerRows(){
  const cur = DATA.meta.currency;
  return [...DATA.transactions].sort((a,b)=>a.seq-b.seq).map(t=>({
    'رقم': t.seq, 'التاريخ': t.date, 'النوع': typeLabel(t.type),
    'العميل': t.clientName||'', 'المشروع': t.projectName||'',
    'دخل': t.income||0, 'خرج': t.expense||0, 'طريقة الدفع': t.method==='bank'?'بنك':'نقدًا',
    'العملة': t.currency||cur, 'ملاحظات': t.notes||'',
  }));
}
function projectRows(){
  const a = computeAggregates(DATA); const cur = DATA.meta.currency;
  return a.projects.map(p=>({
    'المشروع': p.name, 'الزبون': p.clientName||'غير محدد', 'الحالة': p.status,
    'قيمة العقد': p.contractValue||0, 'المقبوض': p.received||0, 'المتبقي': p.remaining||0,
    'تكلفة المواد': p.costs.materials||0, 'أجور عمال': p.costs.labor||0, 'أجور فنيين': p.costs.technicians||0,
    'نقل': p.costs.transport||0, 'وقود': p.costs.fuel||0, 'أدوات': p.costs.tools||0,
    'إجمالي التكلفة': p.totalCost||0, 'الربح': p.profit||0,
    'هامش الربح %': p.contractValue ? ((p.profit/p.contractValue)*100).toFixed(1) : '',
    'العملة': cur,
  }));
}
function clientRows(){
  const cur = DATA.meta.currency;
  return DATA.clients.map(c=>{
    const projects = DATA.projects.filter(p=>p.clientId===c.id);
    const totalValue = projects.reduce((a,p)=>a+num(p.contractValue),0);
    const totalReceived = projects.reduce((a,p)=>a+num(p.received),0);
    return {
      'الزبون': c.name, 'تواصل': c.contact||'', 'عدد المشاريع': projects.length,
      'إجمالي الأعمال': totalValue, 'إجمالي المقبوض': totalReceived, 'المتبقي': totalValue-totalReceived,
      'العملة': cur,
    };
  });
}
function debtRows(direction){
  const cur = DATA.meta.currency;
  return DATA.debts.filter(d=>!direction || d.direction===direction).map(d=>({
    'الطرف': d.party, 'الاتجاه': d.direction==='owed_to_me'?'مستحق لي':'مستحق عليّ',
    'المبلغ الأصلي': d.original||0, 'المدفوع': d.paid||0, 'المتبقي': d.remaining||0,
    'السبب': d.reason||'', 'الحالة': d.status||'', 'العملة': cur,
  }));
}
function summaryRows(){
  const a = computeAggregates(DATA); const cur = DATA.meta.currency;
  return [
    {'البند':'تاريخ التقرير','القيمة': arDate()},
    {'البند':'الصندوق (نقد)','القيمة': DATA.cash.cash},
    {'البند':'البنك','القيمة': DATA.cash.bank},
    {'البند':'إجمالي السيولة','القيمة': a.cashBalance},
    {'البند':'صافي حركة الشهر','القيمة': a.monthNet},
    {'البند':'صافي حركة السنة','القيمة': a.yearNet},
    {'البند':'إجمالي ربح المشاريع','القيمة': a.totalProjectProfit},
    {'البند':'ذمم مستحقة لي من العملاء','القيمة': a.totalReceivablesFromClients},
    {'البند':'ديون مستحقة لي','القيمة': a.debtsOwedToMe},
    {'البند':'ديون مستحقة عليّ','القيمة': a.debtsOwedByMe},
    {'البند':'رأس المال الحالي (تقديري)','القيمة': a.netCapital},
    {'البند':'العملة','القيمة': cur},
  ];
}

function exportAll(){
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheetFromRows(summaryRows()), 'الوضع المالي');
  XLSX.utils.book_append_sheet(wb, sheetFromRows(ledgerRows()), 'سجل العمليات');
  XLSX.utils.book_append_sheet(wb, sheetFromRows(projectRows()), 'المشاريع');
  XLSX.utils.book_append_sheet(wb, sheetFromRows(clientRows()), 'العملاء');
  XLSX.utils.book_append_sheet(wb, sheetFromRows(debtRows()), 'الديون');
  downloadWorkbook(wb, `دفتري-تقرير-شامل-${arDate()}.xlsx`);
}
function exportDebts(){
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheetFromRows(debtRows('owed_to_me')), 'مستحق لي');
  XLSX.utils.book_append_sheet(wb, sheetFromRows(debtRows('owed_by_me')), 'مستحق عليّ');
  downloadWorkbook(wb, `دفتري-الديون-${arDate()}.xlsx`);
}
function exportProjects(){
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheetFromRows(projectRows()), 'المشاريع');
  downloadWorkbook(wb, `دفتري-المشاريع-${arDate()}.xlsx`);
}
function exportClients(){
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheetFromRows(clientRows()), 'العملاء');
  downloadWorkbook(wb, `دفتري-العملاء-${arDate()}.xlsx`);
}
function exportLedger(){
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheetFromRows(ledgerRows()), 'سجل العمليات');
  downloadWorkbook(wb, `دفتري-السجل-${arDate()}.xlsx`);
}

/* ============================ SETTINGS ============================ */
function renderSettings(){
  return `
  <div class="card"><div class="pad">
    <div class="section-title" style="padding:0 0 10px">${icon('settings')} معلومات</div>
    <div style="font-size:13px;color:#5B5340;line-height:1.6">تُحفظ جميع بياناتك تلقائيًا على هذا الجهاز (تخزين محلي داخل التطبيق). عدد العمليات المسجلة: ${DATA.transactions.length}.</div>
  </div></div>
  <div class="card"><div class="pad">
    <div class="section-title" style="padding:0 0 10px">${icon('file')} تصدير إلى Excel</div>
    <div class="muted" style="margin-bottom:10px">أول عملية تصدير تحتاج اتصال إنترنت (لتحميل مكتبة Excel مرة واحدة)، وبعدها تعمل حتى بدون إنترنت.</div>
    <div class="row wrap" style="gap:8px">
      <button class="btn btn-primary" style="flex:1;min-width:140px" onclick="exportAll()">تقرير شامل (كل شيء)</button>
      <button class="btn btn-ghost" style="flex:1;min-width:120px" onclick="exportLedger()">السجل فقط</button>
      <button class="btn btn-ghost" style="flex:1;min-width:120px" onclick="exportProjects()">المشاريع فقط</button>
      <button class="btn btn-ghost" style="flex:1;min-width:120px" onclick="exportClients()">العملاء فقط</button>
      <button class="btn btn-ghost" style="flex:1;min-width:120px" onclick="exportDebts()">الديون فقط</button>
    </div>
  </div></div>
  <div class="card"><div class="pad">
    <div class="section-title" style="padding:0 0 10px">${icon('warn')} منطقة الخطر</div>
    ${!CONFIRM_RESET ? `<button class="btn" style="background:none;color:var(--bad);padding:0;font-weight:600" onclick="CONFIRM_RESET=true;render()">إعادة تهيئة النظام بالكامل (حذف كل البيانات)</button>` : `
    <div style="font-size:13px;color:var(--bad);margin-bottom:8px">هل أنت متأكد؟ هذا الإجراء سيحذف كل البيانات نهائيًا.</div>
    <div class="row"><button class="btn btn-ghost" onclick="CONFIRM_RESET=false;render()">إلغاء</button><button class="btn btn-danger flex1" onclick="resetAll()">تأكيد الحذف</button></div>`}
  </div></div>`;
}
function resetAll(){
  DATA = emptyData(); saveData(DATA);
  CONFIRM_RESET = false; SETUP_STEP = 0; SETUP_DRAFT = null;
  showToast('تمت إعادة تهيئة النظام','bad');
  render();
}

/* ============================ INIT ============================ */
render();

// register service worker for offline support
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
